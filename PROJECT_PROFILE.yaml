project:
  name: unknowns-workflow
  repository: rasokiwayami/unknowns-workflow # Update when forking.
  visibility: public
  type: public_skill_package
  domain: agent_assisted_implementation
  primary_goal: Publish a portable workflow for finding, classifying, and handling unknowns before, during, and after implementation.

authority:
  local_edit: allowed
  public_push: allowed after verification and independent review
  forbidden:
    - secrets or credentials
    - private workspace names or internal policy names
    - raw private evidence
    - unsupported public claims

verification:
  default:
    - python3 -m unittest discover -s tests -q
    - python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
    - python3 -m json.tool .codex-plugin/plugin.json >/dev/null
    - git diff --check

layout:
  skills: skills/
  docs: docs/
  templates: templates/
